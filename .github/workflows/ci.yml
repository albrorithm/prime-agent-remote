name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both versions always report. Cancelling the other run on the first
      # failure is how you learn that something broke without learning which
      # versions it broke on, which is the only interesting part.
      fail-fast: false
      matrix:
        # The floor package.json declares, and the version development
        # actually happens on. Testing one without the other is how a global
        # `sessionStorage` that exists on 26 and not on 22 kept a red suite
        # looking green locally for five days.
        node-version: ['22', '26']
    name: build (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # --ignore-scripts skips `prepare`, which would run the build here and
      # then again for `smoke`; `build` already runs `typecheck` first. One
      # build, one typecheck, then the suite and the smoke test against it.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # End to end against the built artifacts. It caught nothing for a day
      # because it only ran when someone remembered to run it.
      - run: node scripts/smoke.mjs
